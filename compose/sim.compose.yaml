# ============================================================================
# compose.sim.yaml — Simulation stack (macOS dev machine)
# ============================================================================
# Replaces real hardware with software equivalents:
#   px4-sim         → replaces physical flight controller
#   sim-perception  → replaces camera driver (ros_gz_bridge)
#   core            → same as real drone (commander services)
#   pickme-dev      → same as real drone (mission sandbox)
# ============================================================================

networks:
  ros_net:
    driver: bridge

name: pickme_drone
services:

  # ── 1. Gazebo service ──────────────────────────────────────────────────────
  sim:
    container_name: pickme-sim
    ipc: host
    tty: true
    stdin_open: true
    build:
      context: ..
      dockerfile: docker/sim.Dockerfile
    networks:
      - ros_net
    env_file:
      - ../.env
    environment:
      - PX4_SIM_MODEL=gz_x500_depth
      - GZ_PARTITION=sim
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/developer/fastdds.xml
      - ENABLE_MAVLINK_ROUTER=${ENABLE_MAVLINK_ROUTER:-true}
      - MAVLINK_TCP_PORT=${MAVLINK_TCP_PORT:-5760}
      - MAVLINK_QGC_IP=${MAVLINK_QGC_IP:-127.0.0.1}
      - MAVLINK_QGC_PORT=${MAVLINK_QGC_PORT:-14550}
      # 1. Disable gps
      - PX4_PARAM_SYS_HAS_GPS=0
      - PX4_PARAM_EKF2_GPS_CTRL=0 
      - PX4_PARAM_COM_ARM_WO_GPS=1

      # 2. Disable mag
      - PX4_PARAM_SYS_HAS_MAG=0
      - PX4_PARAM_EKF2_MAG_TYPE=5
      - PX4_PARAM_COM_ARM_MAG_STR=0

      # 3. Baro
      - PX4_PARAM_SYS_HAS_BARO=1
      - PX4_PARAM_EKF2_BARO_CTRL=1 

      # 4. Optical flow
      - PX4_PARAM_EKF2_EV_CTRL=15
      - PX4_PARAM_EKF2_EV_DELAY=0
      - PX4_PARAM_EKF2_OF_CTRL=1
      - PX4_PARAM_SENS_FLOW_ROT=0
      - PX4_PARAM_EKF2_OF_QMIN=1
      - PX4_PARAM_EKF2_OF_QMIN_GND=0
      - PX4_PARAM_EKF2_RNG_CTRL=1
      - PX4_PARAM_EKF2_HGT_REF=2

      # 5. Disable outdoor failsafe
      - PX4_PARAM_NAV_DLL_ACT=0
      - PX4_PARAM_NAV_RCL_ACT=0         
      - PX4_PARAM_COM_RC_IN_MODE=1
      - PX4_PARAM_COM_FLTMODE1=0
      - PX4_PARAM_COM_FLTMODE6=3

    ports:
      - "${MAVLINK_TCP_PORT:-5760}:${MAVLINK_TCP_PORT:-5760}"
    volumes:
      - ../config/fastdds.xml:/home/developer/fastdds.xml:ro
      - ../docker/entrypoints/sim-entrypoint.sh:/home/developer/entrypoint.sh:ro
      - ../sim/worlds/default.sdf:/home/developer/PX4-Autopilot/Tools/simulation/gz/worlds/default.sdf:ro
      - ../sim/worlds/materials:/home/developer/PX4-Autopilot/Tools/simulation/gz/worlds/materials:ro
      - ../sim/models/OakD-Lite/model.sdf:/home/developer/PX4-Autopilot/Tools/simulation/gz/models/OakD-Lite/model.sdf:ro
      - ../sim/models/x500_base/model.sdf:/home/developer/PX4-Autopilot/Tools/simulation/gz/models/x500_base/model.sdf:ro
      - ../sim/models/x500_depth/model.sdf:/home/developer/PX4-Autopilot/Tools/simulation/gz/models/x500_depth/model.sdf:ro
      - ../sim/models/carpet_plane:/home/developer/PX4-Autopilot/Tools/simulation/gz/models/carpet_plane:ro

  # ── 2. Gazebo perception service ───────────────────────────────────────────
  sim-perception:
    container_name: pickme-sim-perception
    ipc: host
    build:
      context: ..
      dockerfile: docker/sim-perception.Dockerfile
    networks:
      - ros_net
    environment:
      - ROS_DOMAIN_ID=0
      - GZ_PARTITION=sim
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/developer/fastdds.xml
    volumes:
      - ../config/fastdds.xml:/home/developer/fastdds.xml:ro
      - ../sim/config/bridge.yaml:/etc/pickme/bridge.yaml:ro
    depends_on:
      - core

  # ── 3. Mission-Critical Flight Core ────────────────────────────────────────
  core:
    container_name: pickme-core
    image: pickme-core
    build:
      context: ..
      dockerfile: docker/core.Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    cpuset: "${CORE_CPUSET:-4,5}"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/developer/fastdds.xml
      - USE_SIM_TIME=${USE_SIM_TIME:-true}
      - PUBLISH_CAMERA_TF=${PUBLISH_CAMERA_TF:-true}
      - LAUNCH_OFFBOARD=${LAUNCH_OFFBOARD:-false}
    volumes:
      - ../config/fastdds.xml:/home/developer/fastdds.xml:ro
      - ../src/pickme_odometry:/ws/src/pickme_odometry
      - ../src/pickme_offboard:/ws/src/pickme_offboard
      - ../src/pickme_bringup:/ws/src/pickme_bringup
      - ../workspace/core/build:/ws/build
      - ../workspace/core/install:/ws/install
      - ../workspace/core/log:/ws/log
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      if [ ! -f /ws/install/setup.bash ]; then cd /ws && colcon build --symlink-install; fi &&
      source /ws/install/setup.bash &&
      exec ros2 launch pickme_bringup core.launch.py"
    depends_on:
      - sim

  # ── 4. RTAB-Map Visual Odometry & 3D SLAM ─────────────────────────────────
  perception:
    container_name: pickme-perception
    image: pickme-perception
    build:
      context: ..
      dockerfile: docker/perception.Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    cpuset: "${PERCEPTION_CPUSET:-6,7}"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/developer/fastdds.xml
      - USE_SIM_TIME=${USE_SIM_TIME:-true}
      - SLAM_ENABLE=${SLAM_ENABLE:-false}
    volumes:
      - ../config/fastdds.xml:/home/developer/fastdds.xml:ro
      - ../src/pickme_bringup:/ws/src/pickme_bringup
      - ../workspace/perception/build:/ws/build
      - ../workspace/perception/install:/ws/install
      - ../workspace/perception/log:/ws/log
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      if [ ! -f /ws/install/setup.bash ]; then cd /ws && colcon build --symlink-install; fi &&
      source /ws/install/setup.bash &&
      exec ros2 launch pickme_bringup perception.launch.py"
    depends_on:
      - core
      - sim-perception

  # ── 5. Foxglove WebSocket Telemetry Bridge ─────────────────────────────────
  foxglove:
    container_name: pickme-foxglove
    image: pickme-foxglove
    build:
      context: ..
      dockerfile: docker/foxglove.Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    cpuset: "${FOXGLOVE_CPUSET:-3}"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/developer/fastdds.xml
      - USE_SIM_TIME=${USE_SIM_TIME:-true}
      - FOXGLOVE_PORT=${FOXGLOVE_PORT:-8765}
    volumes:
      - ../config/fastdds.xml:/home/developer/fastdds.xml:ro
      - ../src/pickme_bringup:/ws/src/pickme_bringup
      - ../workspace/foxglove/build:/ws/build
      - ../workspace/foxglove/install:/ws/install
      - ../workspace/foxglove/log:/ws/log
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      if [ ! -f /ws/install/setup.bash ]; then cd /ws && colcon build --symlink-install; fi &&
      source /ws/install/setup.bash &&
      exec ros2 launch pickme_bringup foxglove.launch.py"
    depends_on:
      - core

  # ── 6. Autonomous Mission Sandbox ──────────────────────────────────────────
  dev:
    container_name: pickme-dev
    image: pickme-dev
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    network_mode: host
    cpuset: "${DEV_CPUSET:-1}"
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/home/developer/fastdds.xml
      - USE_SIM_TIME=${USE_SIM_TIME:-true}
    volumes:
      - ../config/fastdds.xml:/home/developer/fastdds.xml:ro
      - ../workspace/dev:/home/developer/workspace
    depends_on:
      - core
