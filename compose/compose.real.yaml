# ============================================================================
# compose.real.yaml — Real drone stack (Radxa Rock 5C / ARM64 board)
# ============================================================================
# Each service gets ONLY the hardware it needs.
# All services communicate via ROS 2 DDS over host network.
# ============================================================================

services:

  # ── PX4 Flight Controller Bridge ──
  # Hardware: /dev/ttyACM0 (USB/UART to flight controller)
  # Critical: keeps drone controllable even if other containers crash
  px4-bridge:
    build:
      context: .
      dockerfile: docker/px4-bridge.Dockerfile
    network_mode: host
    restart: unless-stopped
    devices:
      - ${FC_PORT:-/dev/ttyACM0}:/dev/ttyACM0

  # ── Depth Camera Driver ──
  # Hardware: /dev/bus/usb (USB bus for RealSense)
  # Publishes: /camera/color/image_raw, /camera/depth/*, /camera/depth/color/points
  camera:
    build:
      context: .
      dockerfile: docker/camera.Dockerfile
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - ROS_DOMAIN_ID=0

  # ── Core Background Services ──
  # Hardware: NONE (pure ROS 2 topics)
  # Contains: pickme_commander (arm, takeoff, land, offboard heartbeat)
  # Future:   pickme_localization, pickme_slam
  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=0
    depends_on:
      - px4-bridge

  # ── Developer Sandbox ──
  # Hardware: NONE (pure ROS 2 topics)
  # Mounts: ./src/pickme_missions (your active mission code)
  # Usage:  docker exec -it pickme-dev bash → colcon build → ros2 launch ...
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: pickme-dev
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
    volumes:
      - ./src/pickme_missions:/home/developer/workspace/src/pickme_missions
    command: tail -f /dev/null
    depends_on:
      - core
      - camera
