# ============================================================================
# perception.yaml — Parameters for RTAB-Map Visual Odometry and SLAM
# ============================================================================

rgbd_odometry:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_link"
    odom_frame_id: "odom"
    publish_tf: false
    wait_for_transform: 0.2
    approx_sync: true
    approx_sync_max_interval: 0.10
    sync_queue_size: 30
    topic_queue_size: 30
    subscribe_rgbd: false
    wait_imu_to_init: false

    # RTAB-Map Odometry Algorithmic Parameters
    Odom/Strategy: "0"                  # 0=Frame-to-Map (robust tracking)
    Vis/CorType: "0"                    # 0=Features Matching
    Vis/FeatureType: "8"                # 8=ORB (fast OpenCV native)
    Vis/MaxFeatures: "400"              # Max features extracted per frame
    Vis/MinInliers: "10"                # Min inliers for visual odometry step
    Vis/InlierDistance: "0.1"           # 10 cm max 3D distance for inlier
    Odom/KeyFrameThr: "0.0"             # Publish at full camera rate
    Odom/ResetCountdown: "1"
    Odom/GuessMotion: "true"

rtabmap:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    publish_tf: true
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom_info: false
    approx_sync: true
    approx_sync_max_interval: 0.10
    sync_queue_size: 30
    topic_queue_size: 30

    # ── Keypoint & Feature Matching (ORB for Loop Closure) ──
    Kp/DetectorStrategy: "8"            # 8=ORB
    Kp/MaxFeatures: "500"               # Max words extracted for BoW
    Kp/WordsPerImage: "400"
    Vis/FeatureType: "8"                # 8=ORB for geometric transform estimation
    Vis/MaxFeatures: "500"
    Vis/CorType: "0"

    # ── Anti-False Loop Closure Filtering (Protection against flat/carpet drift) ──
    Vis/MinInliers: "20"                # STRICT: At least 20 matching 3D points required (rejects flat floor noise)
    Vis/InlierDistance: "0.1"           # Max 3D distance (10cm) for inliers
    RGBD/OptimizeMaxError: "1.5"         # REJECT loop closures that cause impossible jumps > 1.5m
    RGBD/LoopClosureReextractFeatures: "true"
    Rtabmap/LoopRatio: "0.85"           # Hypothesis threshold
    Mem/RehearsalSimilarity: "0.50"     # Prevent merging distinct locations

    # ── Spatial Proximity & Detection Rate ──
    Rtabmap/DetectionRate: "2.0"         # 2 Hz loop closure check rate
    Rtabmap/TimeThr: "0"                # Unlimited working memory
    RGBD/ProximityBySpace: "false"      # Disable spatial snapping on repetitive floor; rely on BoW visual landmarks
    RGBD/ProximityByTime: "false"
    RGBD/NeighborLinkRefining: "true"
    RGBD/OptimizeFromGraphEnd: "false"

    # ── Memory & Keyframe Updates (Distinct frames, not every 5cm) ──
    RGBD/LinearUpdate: "0.15"           # Add keyframe every 15 cm (prevents memory clutter)
    RGBD/AngularUpdate: "0.10"          # Add keyframe every ~6 deg

    # ── Graph Optimizer (g2o) ──
    Optimizer/Strategy: "1"             # 1=g2o
    Optimizer/Robust: "true"            # Robust Huber kernel against outliers

    # ── 3D Grid Map & Long-Range Obstacle Detection (0.3m to 5.0m) ──
    Grid/FromDepth: "true"
    Grid/3D: "true"
    Grid/RangeMin: "0.3"                # Ignore extreme near-field (< 30 cm)
    Grid/RangeMax: "5.0"                # Detect obstacles up to 5 meters!
    Grid/MinDepth: "0.3"
    Grid/MaxDepth: "5.0"
    Grid/CellSize: "0.05"               # 5 cm voxel resolution
    Grid/RayTracing: "true"             # Clear free space correctly up to RangeMax
    Grid/NormalsSegmentation: "false"   # Simple height segmentation: never misclassifies distant boxes as floor!
    Grid/MaxGroundHeight: "0.15"        # Points below 15cm = ground
    Grid/MinGroundHeight: "-0.50"
    Grid/MaxObstacleHeight: "2.5"       # Obstacles up to 2.5m
