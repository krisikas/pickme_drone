# ============================================================================
# perception.yaml — Parameters for RTAB-Map Visual Odometry and SLAM
# ============================================================================

rgbd_odometry:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_link"
    odom_frame_id: "odom"
    publish_tf: false
    wait_for_transform: 0.2
    approx_sync: true
    approx_sync_max_interval: 0.10
    sync_queue_size: 30
    topic_queue_size: 30
    subscribe_rgbd: false
    wait_imu_to_init: false

    # RTAB-Map Odometry Algorithmic Parameters
    # 0=Frame-to-Map (more robust & accurate drift estimation), 1=Frame-to-Frame
    Odom/Strategy: "0"

    # 0=Features (matching, required for Frame-to-Map)
    Vis/CorType: "0"

    # Feature type: 8=ORB (fast, native OpenCV), 6=GFTT/ORB
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "350"
    Vis/MinInliers: "8"

    # Motion & Reset thresholds (0.0 = publish at full camera rate, no keyframe throttling)
    Odom/KeyFrameThr: "0.0"
    Odom/ResetCountdown: "1"
    Odom/GuessMotion: "true"

rtabmap:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    publish_tf: true
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom_info: false
    approx_sync: true
    approx_sync_max_interval: 0.10
    sync_queue_size: 30
    topic_queue_size: 30

    # ── Keypoint & Feature Matching (ORB for Loop Closure) ──
    # 8=ORB (Required: prevents defaulting to SURF/SIFT which are disabled in stock OpenCV)
    Kp/DetectorStrategy: "8"
    Kp/MaxFeatures: "500"
    Kp/WordsPerImage: "400"
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "500"
    Vis/MinInliers: "10"
    Vis/CorType: "0"

    # ── Loop Closure & Proximity Detection ──
    Rtabmap/DetectionRate: "2.0"
    Rtabmap/TimeThr: "0"
    RGBD/LoopClosureReextractFeatures: "true"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "false"
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/ProximityMaxGraphDepth: "50"
    RGBD/NeighborLinkRefining: "true"
    RGBD/OptimizeFromGraphEnd: "false"

    # ── Memory & Keyframe Updates ──
    RGBD/LinearUpdate: "0.05"
    RGBD/AngularUpdate: "0.05"
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/RehearsalSimilarity: "0.6"
    Mem/STMSize: "30"

    # ── Graph Optimizer (g2o) ──
    Optimizer/Strategy: "1"
    Optimizer/Robust: "true"

    # ── 3D Grid & Occupancy ──
    Grid/FromDepth: "true"
    Grid/RayTracing: "true"
    Grid/3D: "true"
    Grid/NormalsSegmentation: "true"
    Grid/MaxGroundAngle: "45"
    Grid/MaxGroundHeight: "0.1"
