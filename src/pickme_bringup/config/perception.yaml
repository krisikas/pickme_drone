# ============================================================================
# perception.yaml — Parameters for RTAB-Map Visual Odometry and SLAM
# ============================================================================

rgbd_odometry:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_link"
    odom_frame_id: "odom"
    publish_tf: false
    wait_for_transform: 0.2
    approx_sync: true
    approx_sync_max_interval: 0.10
    sync_queue_size: 30
    topic_queue_size: 30
    subscribe_rgbd: false
    wait_imu_to_init: false

    # RTAB-Map Odometry Algorithmic Parameters
    # 0=Frame-to-Map (more robust & accurate drift estimation), 1=Frame-to-Frame
    Odom/Strategy: "0"

    # 0=Features (matching, required for Frame-to-Map)
    Vis/CorType: "0"

    # Feature type: 8=ORB (fast, native OpenCV), 6=GFTT/ORB
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "350"
    Vis/MinInliers: "8"

    # Motion & Reset thresholds (0.0 = publish at full camera rate, no keyframe throttling)
    Odom/KeyFrameThr: "0.0"
    Odom/ResetCountdown: "1"
    Odom/GuessMotion: "true"

rtabmap:
  ros__parameters:
    use_sim_time: true
    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    publish_tf: true
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom_info: false
    approx_sync: true
    sync_queue_size: 10
    topic_queue_size: 10

    # Memory & Mapping limits
    RGBD/LinearUpdate: "0.1"
    RGBD/AngularUpdate: "0.05"
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Grid/FromDepth: "true"
    Grid/RayTracing: "true"
    Grid/3D: "true"
